apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-consolidator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arc-consolidator
  template:
    metadata:
      labels:
        app: arc-consolidator
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: arc-consolidator
          image: ghcr.io/arckit-iam/arc-consolidator:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: arc-consolidator-config
