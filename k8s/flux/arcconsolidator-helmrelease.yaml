---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-consolidator
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s
      sourceRef:
        kind: GitRepository
        name: arcconsolidator
        namespace: flux-system
      path: k8s
  values:
    image:
      repository: ghcr.io/arckit-iam/arc-consolidator
      tag: "latest"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
    kafka:
      sourceBootstrapServers: "kafka.iap.local:30092"
      targetBootstrapServers: "kafka.iap.local:30092"
