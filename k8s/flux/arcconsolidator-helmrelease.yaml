---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-consolidator
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: k8s
      sourceRef:
        kind: GitRepository
        name: arcconsolidator
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/arckit-iam/arc-consolidator
      tag: "1.0.19-dev"
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
    kafka:
      sourceBootstrapServers: "redpanda-external.arckit.svc.cluster.local:9092"
      targetBootstrapServers: "redpanda-external.arckit.svc.cluster.local:9092"
