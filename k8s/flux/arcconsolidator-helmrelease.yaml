apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: arc-consolidator
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: ../chart
      sourceRef:
        kind: GitRepository
        name: arcconsolidator
        namespace: flux-system
  values:
    image:
      repository: ghcr.io/arckit-iam/arc-consolidator
      tag: "latest" # à mettre à jour dans Git pour déployer une nouvelle version
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr
