apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-consolidator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: arc-consolidator
  template:
    metadata:
      labels:
        app: arc-consolidator
    spec:
      containers:
        - name: arc-consolidator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: arc-consolidator-config
