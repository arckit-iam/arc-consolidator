spring:
  kafka:
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: arc-consolidator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      bootstrap-servers: ${SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


arc:
  topic: ${ARC_TOPIC:arc} # topic legacy (tous types)
  topics:
    identity: ${ARC_TOPIC_IDENTITY:arc.sync.identity}
    entitlement: ${ARC_TOPIC_ENTITLEMENT:arc.sync.entitlement}
    assignment: ${ARC_TOPIC_ASSIGNMENT:arc.sync.assignment}

iam:
  topics:
    activedirectory: ${IAM_TOPICS_ACTIVEDIRECTORY:iam.raw.activedirectory}
    ldap: ${IAM_TOPICS_LDAP:iam.raw.ldap}
  ldap:
    # DN des membres techniques de groupes a ignorer, separes par des points-virgules
    ignored-members: ${IAM_LDAP_IGNORED_MEMBERS:}
