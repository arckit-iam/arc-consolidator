spring:
  kafka:
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS:localhost:9092}
      group-id: arc-consolidator
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      bootstrap-servers: ${SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


arc:
  topic: ${ARC_TOPIC:arc} # topic legacy (tous types)
  topics:
    identity: ${ARC_TOPIC_IDENTITY:arc.identity}
    entitlement: ${ARC_TOPIC_ENTITLEMENT:arc.entitlement}
    assignment: ${ARC_TOPIC_ASSIGNMENT:arc.assignment}

iam:
  topics:
    activedirectory: ${IAM_TOPICS_ACTIVEDIRECTORY:iam.raw.activedirectory}
