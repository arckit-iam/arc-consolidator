name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: "Version de l'image Docker à déployer"
        required: true
        type: string
      runner_label:
        description: "Label du runner self-hosted"
        required: false
        type: string
        default: "iap-k3s"
      env_name:
        description: "Nom de l'environnement GitHub"
        required: false
        type: string
        default: "prod"
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image Docker à déployer"
        required: true
        type: string
      runner_label:
        description: "Label du runner self-hosted"
        required: false
        type: string
        default: "iap-k3s"
      env_name:
        description: "Nom de l'environnement GitHub"
        required: false
        type: string
        default: "prod"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/arc-consolidator

jobs:
  deploy:
    environment: ${{ inputs.env_name }}
    runs-on: [self-hosted, arc-consolidator]
    steps:
      - name: Write kubeconfig to file
        run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml

      - name: Apply all FluxCD manifests (k8s/flux)
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml
        run: |
          kubectl apply -f k8s/flux/