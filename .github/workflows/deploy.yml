name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: "Version de l'image Docker à déployer"
        required: true
        type: string
      runner_label:
        description: "Label du runner self-hosted"
        required: false
        type: string
        default: "iap-k3s"
      env_name:
        description: "Nom de l'environnement GitHub"
        required: false
        type: string
        default: "prod"
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image Docker à déployer"
        required: true
        type: string
      runner_label:
        description: "Label du runner self-hosted"
        required: false
        type: string
        default: "iap-k3s"
      env_name:
        description: "Nom de l'environnement GitHub"
        required: false
        type: string
        default: "prod"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/arc-consolidator

jobs:
  deploy:
    environment: ${{ inputs.env_name }}
    runs-on: [self-hosted, arc-consolidator]
    steps:
      - name: Write kubeconfig to file
        run: echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml

      - name: Extract Helm chart from image
        run: |
          docker create --name temp_chart ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          docker cp temp_chart:/app/chart ./chart
          docker rm temp_chart

      - name: Deploy with Helm (init ou update)
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml
        run: |
          helm upgrade --install arc-consolidator ./chart \
            -f ./chart/values.yaml \
            --namespace default --create-namespace

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}

      - name: Set image in k3s deployment
        env:
          KUBECONFIG: ${{ github.workspace }}/kubeconfig.yaml
        run: |
          kubectl set image deployment/arc-consolidator \
            arc-consolidator=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}